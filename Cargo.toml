[package]
name = "clang-tidy-gui"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "A desktop workspace for running clang-tidy checks one at a time"
license = "CC0-1.0"
repository = "https://github.com/varnholt/clang-tidy-gui"
readme = "README.md"
keywords = ["clang-tidy", "cpp", "gui", "lint", "refactoring"]
categories = ["development-tools", "gui"]
include = ["src/**", "fixes.txt", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "doc/screenshot_main.png", "doc/screenshot_light.png", "examples/cpp/CMakeLists.txt", "examples/cpp/main.cpp"]

[features]
screenshot = ["eframe/__screenshot"]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
directories = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17.2"
tempfile = "3"
